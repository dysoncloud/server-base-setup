name: server-base-setup LIVE DEPLOY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checks out repository
        uses: actions/checkout@v3

      - name: Exit if not on main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: exit 1

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
     - name: SSH Deploy Node 1
       uses: appleboy/ssh-action@master
       with:
          host: ${{ secrets.PROD_HOST_1 }}
          username:  ${{ secrets.PROD_USER_1 }}
          key:  ${{ secrets.PROD_KEY_1 }}
          script: |
               cd ~/server-base-setup
               git pull

     - name: SSH Deploy Node 2
       uses: appleboy/ssh-action@master
       with:
          host: ${{ secrets.PROD_HOST_2 }}
          username:  ${{ secrets.PROD_USER_2 }}
          key:  ${{ secrets.PROD_KEY_2 }}
          script: |
               cd ~/server-base-setup
               git pull