server {
    listen 80 default_server reuseport;
    listen [::]:80 default_server reuseport;
    return 444;
}

server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;
    ssl_stapling off;
    ssl_certificate /etc/nginx/ssl/_default/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/_default/key.pem;
    return 444;
}